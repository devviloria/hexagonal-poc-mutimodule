apiVersion: apps/v1
kind: Deployment
metadata:
  name: hexagonal-products
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hexagonal-products
  template:
    metadata:
      labels:
        app: hexagonal-products
    spec:
      containers:
        - name: hexagonal-products
          image: hexagonal-products:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
